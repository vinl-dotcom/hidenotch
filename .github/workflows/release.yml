name: Build macOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Apple Silicon app archive
        env:
          VERSION: ${{ github.ref_name }}
        run: ./package-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          ARCHIVE="dist/HideNotch-$VERSION-macos-arm64.zip"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete-asset "$VERSION" \
              "HideNotch-$VERSION-universal-macos.zip" \
              --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
            gh release upload "$VERSION" "$ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" "$ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "HideNotch $VERSION" \
              --generate-notes
          fi
